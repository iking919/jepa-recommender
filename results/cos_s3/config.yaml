seed: 3
device: cuda
data:
  train_path: data/processed/ml-1m/jepa/train_context_target.parquet
  validation_path: data/processed/ml-1m/jepa/validation.parquet
  test_path: data/processed/ml-1m/jepa/test.parquet
model:
  vocab_size: 3418
  max_seq_len: 200
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  feed_forward_dim: 1024
  dropout: 0.2
  pad_token_id: 0
  causal: true
training:
  batch_size: 64
  learning_rate: 0.0005
  weight_decay: 0.01
  num_epochs: 60
  patience: 100
  window_stride: 100
  lr_schedule: cosine
  warmup_epochs: 2
  min_lr_ratio: 0.0
  selection_window: 3
  ema_decay: 0.996
  mixed_precision: true
  amp_dtype: bfloat16
  compile: false
output:
  experiment_name: cos_s3
  checkpoint_dir: checkpoints/cos_s3
  results_dir: results/cos_s3
  best_checkpoint_name: cos_s3_best.pt
