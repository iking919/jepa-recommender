seed: 42
device: cuda
data:
  train_path: data/processed/ml-1m/jepa/train_context_target.parquet
  validation_path: data/processed/ml-1m/jepa/validation.parquet
  test_path: data/processed/ml-1m/jepa/test.parquet
model:
  vocab_size: 3418
  max_seq_len: 200
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  feed_forward_dim: 1024
  dropout: 0.2
  pad_token_id: 0
training:
  batch_size: 512
  learning_rate: 0.0005
  weight_decay: 0.01
  num_epochs: 3
  patience: 4
  ema_decay: 0.996
  mixed_precision: true
  amp_dtype: float16
  compile: false
  trim_padding: true
  length_bucketing: 20
  num_workers: 0
output:
  experiment_name: bench_trim_bucket20
  checkpoint_dir: checkpoints/benchmarks/trim_bucket20
  results_dir: results/benchmarks/trim_bucket20
  best_checkpoint_name: bench_trim_bucket20.pt
