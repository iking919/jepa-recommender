seed: 42
device: cuda
data:
  train_path: data/processed/ml-1m/jepa/train_context_target.parquet
  validation_path: data/processed/ml-1m/jepa/validation.parquet
  test_path: data/processed/ml-1m/jepa/test.parquet
model:
  vocab_size: 3418
  max_seq_len: 200
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  feed_forward_dim: 1024
  dropout: 0.2
  pad_token_id: 0
  causal: true
training:
  batch_size: 64
  learning_rate: 0.0005
  weight_decay: 0.01
  num_epochs: 150
  patience: 20
  window_stride: 100
  lr_schedule: constant
  warmup_epochs: 0
  min_lr_ratio: 0.0
  selection_window: 1
  ema_decay: 0.996
  mixed_precision: true
  amp_dtype: bfloat16
  compile: false
output:
  experiment_name: corrected_const_s1
  checkpoint_dir: checkpoints/corrected_const_s1
  results_dir: results/corrected_const_s1
  best_checkpoint_name: corrected_const_s1_best.pt
