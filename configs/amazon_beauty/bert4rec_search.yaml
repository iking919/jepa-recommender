# BERT4Rec hyperparameter-search base configuration.
#
# Base config for scripts/run_bert4rec_hyperparameter_search.py. The search
# overrides learning_rate, weight_decay, mask_probability and batch_size per
# trial (see SEARCH_SPACE in the script); everything else comes from here.
# Architecture matches the tuned Amazon Beauty config. The epoch cap is
# shortened for screening; retrain the winner with a longer cap.

seed: 42

device: "cuda"

data:
  train_sequences_path: "data/processed/{dataset}/bert4rec/train_sequences.parquet"
  validation_path: "data/processed/{dataset}/bert4rec/validation.parquet"
  test_path: "data/processed/{dataset}/bert4rec/test.parquet"

model:
  # vocab_size and max_seq_len come from configs/datasets/<dataset>.yaml
  hidden_dim: 128
  num_layers: 2
  num_heads: 4
  feed_forward_dim: 512
  dropout: 0.2
  pad_token_id: 0
  mask_token_id: 1

training:
  batch_size: 256          # overridden per trial by the search
  learning_rate: 0.0003    # overridden per trial by the search
  weight_decay: 0.05       # overridden per trial by the search
  num_epochs: 100          # screening cap 
  patience: 10            
  mask_probability: 0.3    # overridden per trial by the search
  num_workers: 2
  persistent_workers: true
  use_scheduler: false
  scheduler_type: "cosine_annealing"
  min_lr: 0.00001

output:
  experiment_name: "bert4rec_search"
  # Outputs go to results/<dataset>/<experiment_name> and
  # checkpoints/<dataset>/<experiment_name> (derived; see src/utils/paths.py).