# JEPA causal one-pass tuned configuration.
#
# Uses the same causal architecture and data pipeline as jepa_causal_tuned.yaml.
# Optimization settings are tuned starting values, before hyperparameter tuning.
# Keep the architecture, data splits, evaluation, and training implementation
# identical to the tuned experiment for a fair comparison.

seed: 42

device: "cuda"

data:
  train_path: "data/processed/{dataset}/jepa/train_context_target.parquet"
  validation_path: "data/processed/{dataset}/jepa/validation.parquet"
  test_path: "data/processed/{dataset}/jepa/test.parquet"

model:
  # vocab_size and max_seq_len come from configs/datasets/<dataset>.yaml
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  feed_forward_dim: 1024
  dropout: 0.1
  pad_token_id: 0
  causal: true

training:
  batch_size: 512
  learning_rate: 0.0005
  weight_decay: 0.01
  num_epochs: 300
  patience: 40
  window_stride: 25
  lr_schedule: "constant"
  warmup_epochs: 0
  min_lr_ratio: 0.0
  selection_window: 1
  ema_decay: 0.996
  mixed_precision: true
  amp_dtype: "bfloat16"
  compile: false

output:
  experiment_name: "jepa_causal_tuned"
  # Outputs go to results/<dataset>/<experiment_name> and
  # checkpoints/<dataset>/<experiment_name> (derived; see src/utils/paths.py).
