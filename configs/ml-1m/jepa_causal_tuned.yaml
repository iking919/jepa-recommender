# JEPA with causal one-pass training, using a constant learning rate schedule.
#
# Same model size as jepa_tuned.yaml; the encoder is causal and each epoch
# encodes every user sequence once (a few windows per user) instead of one
# prefix per target. The optimization settings below are starting values,
# not tuned: an epoch now has ~100x fewer forward passes but also far fewer
# optimizer steps, so expect to need more epochs than the prefix model.

seed: 123

device: "cuda"

data:
  train_path: "data/processed/{dataset}/jepa/train_context_target.parquet"
  validation_path: "data/processed/{dataset}/jepa/validation.parquet"
  test_path: "data/processed/{dataset}/jepa/test.parquet"

model:
  # vocab_size and max_seq_len come from configs/datasets/<dataset>.yaml
  hidden_dim: 384
  num_layers: 4
  num_heads: 8
  feed_forward_dim: 1024
  dropout: 0.2
  pad_token_id: 0
  causal: true               # required by train_jepa_causal and evaluation

training:
  batch_size: 64             # windows per step (~4-5k supervised targets)
  learning_rate: 0.0005
  weight_decay: 0.01
  num_epochs: 150
  patience: 20
  window_stride: 100         # windows start every N items (all ML-1M sequences fit in one)
  lr_schedule: "cosine"    # "constant" or "cosine"
  warmup_epochs: 0           # linear warmup length, in epochs 
  min_lr_ratio: 0.0          # cosine floor as a fraction of learning_rate
  selection_window: 1        # pick best epoch by mean NDCG@10 of the last N epochs (1 = raw)
  ema_decay: 0.996
  mixed_precision: true
  dropout: 0.2
  amp_dtype: "bfloat16"
  compile: false             # enable after the first run checks out

output:
  experiment_name: "jepa_causal_tuned"
  # Outputs go to results/<dataset>/<experiment_name> and
  # checkpoints/<dataset>/<experiment_name> (derived; see src/utils/paths.py).
