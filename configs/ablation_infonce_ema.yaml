# Loss ablation, step 1: add negatives, keep the EMA target.
#
# Identical to ablation_infonce_ema.yaml except the loss is a softmax over the
# whole catalogue of cosine similarities to the EMA target embeddings,
# instead of 1 - cosine against the single positive.

seed: 123
device: "cuda"

data:
  train_path: "data/processed/ml-1m/jepa/train_context_target.parquet"
  validation_path: "data/processed/ml-1m/jepa/validation.parquet"
  test_path: "data/processed/ml-1m/jepa/test.parquet"

model:
  vocab_size: 3418
  max_seq_len: 200
  hidden_dim: 384
  num_layers: 4
  num_heads: 8
  feed_forward_dim: 1024
  dropout: 0.2
  pad_token_id: 0
  causal: true               # required by train_jepa_causal and evaluation

training:
  batch_size: 64             # windows per step (~4-5k supervised targets)
  learning_rate: 0.0005
  weight_decay: 0.01
  num_epochs: 150
  patience: 20
  window_stride: 100         # windows start every N items (all ML-1M sequences fit in one)
  lr_schedule: "cosine"    # "constant" or "cosine"
  warmup_epochs: 0           # linear warmup length, in epochs 
  min_lr_ratio: 0.0          # cosine floor as a fraction of learning_rate
  selection_window: 1        # pick best epoch by mean NDCG@10 of the last N epochs (1 = raw)
  ema_decay: 0.996
  mixed_precision: true
  dropout: 0.2
  amp_dtype: "bfloat16"
  compile: false             # enable after the first run checks out
  loss: "infonce_ema"        # cosine | infonce_ema | infonce_tied
  temperature: 0.1           # softmax temperature; try 0.05 / 0.1 / 0.2

output:
  experiment_name: "ablation_infonce_ema"
  checkpoint_dir: "checkpoints/ablation_infonce_ema"
  results_dir: "results/ablation_infonce_ema"
  best_checkpoint_name: "ablation_infonce_ema_best.pt"
