# JEPA baseline configuration.
#
# Baseline architecture used before hyperparameter tuning.

seed: 42
device: "cuda"

data:
  train_path: "data/processed/ml-1m/jepa/train_context_target.parquet"
  validation_path: "data/processed/ml-1m/jepa/validation.parquet"
  test_path: "data/processed/ml-1m/jepa/test.parquet"

model:
  vocab_size: 3418
  max_seq_len: 200
  hidden_dim: 128
  num_layers: 2
  num_heads: 4
  feed_forward_dim: 512
  dropout: 0.1
  pad_token_id: 0

training:
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.01
  num_epochs: 10
  patience: 3
  ema_decay: 0.996
  mixed_precision: true
  num_workers: 0
  trim_padding: true 

output:
  experiment_name: "jepa_baseline"
  checkpoint_dir: "checkpoints/jepa_baseline"
  results_dir: "results/jepa_baseline"
  best_checkpoint_name: "jepa_baseline_best.pt"
